name: Build stilldrops

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: 编译
        run: gradle build

      - name: 上传 jar
        uses: actions/upload-artifact@v4
        with:
          name: stilldrops-jar
          path: build/libs/*.jar
